name: Automated Releases
on:
  # schedule:
  #   - cron: "0 5 * * *"
  push:
    branches:
      - main
  workflow_dispatch:
# amazing grace
permissions:
  contents: write

jobs:
  copy:
    name: New release
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      # - name: Set up Python 3
      #   uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      #   with:
      #     python-version: "3.12"
      # - name: Install Dependencies
      #   run: pip install requests
      # - name: Fetch commit tag or exit
      #   id: fetch_commit_tag
      #   env:
      #     TARGET_URL: "https://pontoon.mozilla.org/static/revision.txt"
      #   run: python .github/scripts/fetch_commit_tag.py
      - name: Fetch commit hash
        id: hash
        run: |
          COMMIT_HASH=$(curl -s https://pontoon.mozilla.org/static/revision.txt)

          if [ -z "$COMMIT_HASH" ]; then
            echo "::error::Failed to fetch commit hash. The website returned an empty string or threw an error."
            exit 1
          fi

          echo "Found hash: $COMMIT_HASH"
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
      - name: Get commit tag
        id: tag
        run: |
          TAG=$(git describe --tags --exact-match ${{ steps.hash.outputs.commit_hash }} 2>/dev/null)

          if [[ "$TAG" == v20* ]]; then
            echo "Release notes already exist"
            exit 1
          fi

          echo "The tag for commit $COMMIT_HASH is: $TAG"
          echo "commit_tag=$COMMIT_TAG" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        if: steps.fetch_commit_tag.outputs.release == 'true'
        uses: softprops/action-gh-release@v2 # need to change to sha
        with:
          tag_name: "${{ steps.tag.outputs.commit_tag }}"
          name: "Release ${{ steps.tag.outputs.version }}"
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
